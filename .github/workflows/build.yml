name: Build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Format check — fast, no dependencies required
  # -------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src -name '*.c' -o -name '*.h' | \
            xargs clang-format-18 --dry-run --Werror

  # -------------------------------------------------------------------------
  # Main build — compiles pulse-de and runs tests
  # -------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            libwlroots-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libdrm-dev libgbm-dev \
            libinput-dev libudev-dev libpixman-1-dev libseat-dev \
            clang gcc

      - name: Configure (Meson)
        run: meson setup builddir --buildtype=debug -Db_sanitize=address

      - name: Build
        run: ninja -C builddir

      - name: Unit tests
        run: ninja -C builddir test

  # -------------------------------------------------------------------------
  # Headless Wayland integration tests
  # Only runs when the build succeeds — these start a real nested Wayland session
  # using Weston as the host compositor.
  # -------------------------------------------------------------------------
  integration:
    name: Integration tests (headless Wayland)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config weston \
            libwlroots-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libdrm-dev libgbm-dev \
            libinput-dev libudev-dev libpixman-1-dev libseat-dev

      - name: Build
        run: |
          meson setup builddir --buildtype=debug
          ninja -C builddir

      - name: Run integration tests
        run: |
          # Start Weston headless as the host compositor
          weston --backend=headless --socket=weston-test &
          WESTON_PID=$!
          sleep 1

          WAYLAND_DISPLAY=weston-test \
            ninja -C builddir test-integration || STATUS=$?

          kill $WESTON_PID 2>/dev/null
          exit ${STATUS:-0}
